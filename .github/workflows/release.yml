name: Release

# A tag v* builds the Windows installer. The frozen-kernel tests are the gate: the
# installer is only published when the PyInstaller build passes them and the packaged
# application passes its smoke test. The result is a draft release for review.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, test and draft the release
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            kernel/requirements.txt
            kernel/requirements-dev.txt

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\python -m pip install -r kernel\requirements-dev.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package.json version $version"
          }

      - name: All checks
        run: npm run check

      - name: Slow kernel tests
        run: npm run kernel:test:all

      - name: Build the installer
        run: npm run dist

      - name: Frozen kernel tests (gate)
        shell: pwsh
        run: |
          $env:M2C_KERNEL_EXE = "$PWD\release\kernel\m2c-kernel.exe"
          npm run kernel:test -- kernel/tests/frozen -m frozen

      - name: Packaged application smoke test
        shell: pwsh
        run: |
          $env:M2C_APP_BINARY = "$PWD\release\win-unpacked\Mesh-to-CAD.exe"
          npx playwright test tests/e2e/packaged.spec.ts

      - name: Microsoft Defender scan of the installer
        shell: pwsh
        run: |
          $installer = Get-Item "release\Mesh-to-CAD-*-Setup.exe"
          $defender = Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $defender) { $defender = Get-Item "$env:ProgramFiles\Windows Defender\MpCmdRun.exe" }
          & $defender.FullName -SignatureUpdate
          & $defender.FullName -Scan -ScanType 3 -File $installer.FullName -DisableRemediation
          if ($LASTEXITCODE -ne 0) { throw "Microsoft Defender reported the installer (exit $LASTEXITCODE)" }

      - name: Checksums and sizes
        id: artifacts
        shell: pwsh
        run: |
          $installer = Get-Item "release\Mesh-to-CAD-*-Setup.exe"
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii "release\SHA256SUMS.txt"
          $kernel = (Get-ChildItem release\kernel -Recurse -File | Measure-Object Length -Sum).Sum
          $installerMB = [math]::Round($installer.Length / 1MB, 1)
          $kernelMB = [math]::Round($kernel / 1MB, 1)
          "Installer: $installerMB MB (target 200 MB)" >> $env:GITHUB_STEP_SUMMARY
          "Unpacked kernel: $kernelMB MB (target 450 MB)" >> $env:GITHUB_STEP_SUMMARY
          "SHA-256: $hash" >> $env:GITHUB_STEP_SUMMARY
          "installer=$($installer.FullName)" >> $env:GITHUB_OUTPUT

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" --draft --title "Mesh-to-CAD ${{ github.ref_name }}" `
            --notes "See CHANGELOG.md. SHA-256 checksums are in SHA256SUMS.txt." `
            "${{ steps.artifacts.outputs.installer }}" release\SHA256SUMS.txt

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-results
          path: |
            test-results/
            release/kernel-size.json
          retention-days: 14
