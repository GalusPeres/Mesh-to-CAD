name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly run of the slow kernel tests (Monday 03:00 UTC).
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test and build
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            kernel/requirements.txt
            kernel/requirements-dev.txt

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\python -m pip install -r kernel\requirements-dev.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Versions
        run: node scripts/check-versions.mjs

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Generated protocol types
        run: npm run codegen:check

      - name: Kernel lint
        run: npm run kernel:lint

      - name: Kernel tests
        run: npm run kernel:test

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: End-to-end smoke test
        run: npx playwright test tests/e2e/smoke.spec.ts

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  slow:
    name: Slow kernel tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            kernel/requirements.txt
            kernel/requirements-dev.txt

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install -r kernel\requirements-dev.txt

      - name: All kernel tests
        run: npm run kernel:test:all
